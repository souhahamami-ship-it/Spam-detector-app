<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Spam Detector</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .spam {
            color: #e53e3e;
        }

        .ham {
            color: #38a169;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📧 Spam Detector</h1>

    <form method="POST">
        <textarea name="email" placeholder="Paste your email here..."></textarea>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
        <div class="result">
            Result:
            <span class="{{ 'spam' if result == 'Spam' else 'ham' }}">
                {{ result }}
            </span>
            <p>Confidence: {{ confidence }}%</p>
        </div>
    {% endif %}
</div>

</body>
</html>
